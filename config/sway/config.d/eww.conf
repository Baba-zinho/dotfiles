# ~/.config/sway/config.d/eww.conf — panneau eww
# Pas de commentaire en fin de ligne (Sway ne les accepte pas).

exec eww daemon

# Meta+P : ouvrir / fermer le panneau
bindsym $mod+p exec eww open --toggle panneau

# Flou derrière le panneau (seulement sous les pixels non transparents)
layer_effects "eww" blur enable; blur_ignore_transparent enable
