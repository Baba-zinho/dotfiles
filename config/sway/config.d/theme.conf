# ~/.config/sway/config.d/theme.conf — notifications, curseur, thème GTK, icônes
# Inclus automatiquement par la dernière ligne de sway/config.
# Pas de commentaire en fin de ligne (Sway ne les accepte pas).

# ── Curseur (taille 24) ──
seat seat0 xcursor_theme Bibata-Modern-Classic 24

# ── Notifications ──
exec mako
# Flou derrière les notifications (même effet que Waybar)
layer_effects "notifications" blur enable; shadows enable; corner_radius 12

# Meta+N : fermer la dernière notification · Meta+Maj+N : toutes les fermer
bindsym $mod+n       exec makoctl dismiss
bindsym $mod+Shift+n exec makoctl dismiss --all

# ── Thème GTK sous Wayland : passe par gsettings (lu par Nemo & co) ──
exec_always {
    gsettings set org.gnome.desktop.interface gtk-theme    'adw-gtk3-dark'
    gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'
    gsettings set org.gnome.desktop.interface icon-theme   'Papirus-Dark'
    gsettings set org.gnome.desktop.interface cursor-theme 'Bibata-Modern-Classic'
    gsettings set org.gnome.desktop.interface cursor-size  24
    gsettings set org.gnome.desktop.interface font-name    'Maple Mono NF 10'
}

# Nemo vient de Cinnamon et lit ses propres réglages (org.cinnamon…)
exec_always {
    gsettings set org.cinnamon.desktop.interface gtk-theme    'adw-gtk3-dark'
    gsettings set org.cinnamon.desktop.interface icon-theme   'Papirus-Dark'
    gsettings set org.cinnamon.desktop.interface cursor-theme 'Bibata-Modern-Classic'
    gsettings set org.cinnamon.desktop.interface cursor-size  24
    gsettings set org.cinnamon.desktop.default-applications.terminal exec kitty
    gsettings set org.nemo.desktop show-desktop-icons false
}
