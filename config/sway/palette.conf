# ~/.config/sway/palette.conf
# ─────────────────────────────────────────────────────────────
#  Palette « Feels » — tirée de ton fond d'écran
#  (bleu nuit du fond, vert de la grenouille, bleu du t-shirt,
#   orange des éclats à droite, rose saumon des lèvres)
#  SOURCE DE VÉRITÉ : mêmes hex dans waybar/style.css, wofi/style.css et kitty/kitty.conf
#  Contraste de chaque accent sur $bg ≥ 4,5:1 (lisible).
# ─────────────────────────────────────────────────────────────

# Fonds (bleu nuit du coin gauche)
set $bg          #0e1726
set $bg_dark     #0b0d1a
set $bg_hl       #1a2f42
set $border      #2a4556
set $comment     #5f7a8c

# Textes (blanc légèrement bleuté du texte de l'image)
set $fg          #dfe8ee
set $fg_dark     #a8bcc8

# Accents
# grenouille — accent principal (focus)
set $green       #4cc274
# reflets clairs de la grenouille
set $mint        #9bc8ab
# t-shirt
set $blue        #7393ea
# éclats bleu-pétrole du fond
set $cyan        #4fa8bd
# éclats orange à droite
set $orange      #e8894f
# rouille / alertes
set $red         #e5654a
# point le plus chaud de l'orange
set $yellow      #f2c46b
# lèvres
set $pink        #e39a8a
