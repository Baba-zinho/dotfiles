# ~/.config/kitty/kitty.conf  —  kitty · palette « Feels » · Maple Mono NF
# Recharger sans fermer : Ctrl+Maj+F5   |   Doc : https://sw.kovidgoyal.net/kitty/conf/

# ── Police ──
# « Maple Mono NF » contient déjà les icônes Nerd Font : pas de police de secours à prévoir
# font_family      Maple Mono NF Italic
# bold_font        auto
# italic_font      auto
# bold_italic_font auto
font_size        11.0
# Ligatures (=> != ->) : désactivées seulement sous le curseur, pour éditer facilement
disable_ligatures cursor

# ── Fenêtre ──
window_padding_width 12
# SwayFX floute ce qu'il y a derrière
background_opacity   0.90
confirm_os_window_close 0

# ── Shell ──
# fish seulement dans le terminal ; bash reste le shell de connexion (plus sûr)
shell fish
enable_audio_bell no
visual_bell_duration 0

# ── Curseur & souris ──
cursor_shape        beam
cursor_blink_interval 0.6
mouse_hide_wait     2.0
copy_on_select      no
scrollback_lines    10000

# ── Onglets (Ctrl+Maj+T nouveau, Ctrl+Maj+→/← naviguer) ──
tab_bar_edge      bottom
tab_bar_style     powerline
tab_powerline_style round

# ═════════════ Couleurs « Feels » (mêmes hex que sway/palette.conf) ═════════════
foreground            #dfe8ee
background            #0e1726
selection_foreground  #dfe8ee
selection_background  #1f4a5c
url_color             #4fa8bd
cursor                #4cc274
cursor_text_color     #0e1726

active_border_color   #4cc274
inactive_border_color #2a4556

active_tab_foreground   #0b0d1a
active_tab_background   #4cc274
inactive_tab_foreground #a8bcc8
inactive_tab_background #1a2f42
tab_bar_background      #0b0d1a

# normal :  noir   rouge   vert    jaune   bleu    rose    cyan    blanc
color0  #1a2f42
color1  #e5654a
color2  #4cc274
color3  #f2c46b
color4  #7393ea
color5  #e39a8a
color6  #4fa8bd
color7  #a8bcc8
# clair
color8  #3a566a
color9  #f07c62
color10 #6fd892
color11 #ffd68a
color12 #8fa8f0
color13 #f0b2a4
color14 #74c0d2
color15 #eef3f6
# extra (utilisés par certains thèmes Neovim)
color16 #e8894f
color17 #c0593c


# BEGIN_KITTY_FONTS
font_family      family='Maple Mono NF' postscript_name=MapleMono-NF-Italic
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS